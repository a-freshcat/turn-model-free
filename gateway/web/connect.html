<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>turn-model-free · 导入账号</title>
<link rel="stylesheet" href="/assets/console.css?v=1.4.0">
<style>
  .page {
    min-height: 100%;
    display: grid; place-items: start center;
    padding: 32px 20px;
  }
  .sheet {
    width: min(560px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .sheet-head {
    padding: 15px 20px;
    background: var(--surface-alt);
    border-bottom: 1px solid var(--line);
  }
  .sheet-head h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .sheet-head p { margin: 4px 0 0; font-size: 11.5px; color: var(--ink-3); }
  .sheet-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 11.5px; color: var(--ink-2); }
  .field > span em { font-style: normal; color: var(--ink-3); font-size: 10.5px; padding-left: 4px; }
  .field input, .field select, .field textarea {
    font: inherit; font-size: 12.5px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 7px 10px; outline: none;
    width: 100%;
  }
  .field textarea { font-family: var(--mono); font-size: 11.5px; line-height: 1.6; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent-edge); box-shadow: 0 0 0 3px rgba(168,86,100,.11);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions { display: flex; gap: 8px; margin-top: 4px; }
  .actions .btn { flex: 1; justify-content: center; }
  .hint {
    font-size: 11px; color: var(--ink-3);
    background: var(--surface-alt);
    border: 1px dashed var(--line);
    border-radius: var(--r-sm);
    padding: 9px 11px;
    line-height: 1.65;
  }
  .hint code { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); }
  .err { font-size: 11.5px; color: var(--cinnabar); min-height: 16px; }
  .ok { font-size: 11.5px; color: var(--jade); min-height: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-theme="paper">
<div class="page">
  <form class="sheet" id="import-form">
    <div class="sheet-head">
      <h1 id="import-title">导入已有上游</h1>
      <p id="import-note">正在读取添加窗口…</p>
    </div>
    <div class="sheet-body">
      <!-- 表单承载共用字段；gemini 模式只显示下面那块「一个 Key」的输入。 -->
      <input type="hidden" name="id">
      <input type="hidden" name="models" value="{}">
      <input type="hidden" name="max_concurrency" value="1">

      <div id="gemini-fields" hidden>
        <label class="field">
          <span>Gemini API Key</span>
          <input name="gemini_key" type="password" autocomplete="off" spellcheck="false"
                 placeholder="AIza…（粘贴到这里）">
        </label>
        <label class="field">
          <span>备注名 <em>可选</em></span>
          <input name="gemini_nickname" maxlength="64" placeholder="例如：主号 / 备用">
        </label>
        <div class="hint">
          打开 <code>aistudio.google.com/apikey</code>，点 <code>Create API key</code>，
          复制生成的 <code>AIza…</code> 粘贴到上面，然后点「保存账号」。
          模型清单由本机网关读取官方目录自动填入，不需要你手写。
        </div>
      </div>

      <div id="generic-fields">
        <div class="row2">
          <label class="field">
            <span>账号 ID</span>
            <input name="id_visible" pattern="[A-Za-z0-9_.-]{1,64}" maxlength="64" placeholder="account-01">
          </label>
          <label class="field">
            <span>显示名称 <em>可选</em></span>
            <input name="nickname" maxlength="64" placeholder="用于区分你的账号">
          </label>
        </div>

        <label class="field" id="endpoint-field">
          <span>完整 Chat Completions 地址</span>
          <input name="endpoint" type="url" placeholder="https://provider.example/v1/chat/completions">
        </label>

        <label class="field">
          <span>模型映射 <em>对外名称 → 上游模型 ID</em></span>
          <textarea name="models_visible" rows="4" spellcheck="false">{"local-chat":"provider-model-id"}</textarea>
        </label>

        <div id="credential-fields">
          <div class="row2">
            <label class="field">
              <span>凭据类型</span>
              <select name="credential_type">
                <option value="token_env">Token 环境变量</option>
                <option value="token">Bearer Token</option>
                <option value="cookie_env">Cookie 环境变量</option>
                <option value="cookie">Cookie</option>
                <option value="">无凭据</option>
              </select>
            </label>
            <label class="field">
              <span>凭据值 / 环境变量名</span>
              <input name="credential" type="password" autocomplete="new-password">
            </label>
          </div>
        </div>

        <label class="field" style="max-width:200px">
          <span>单账号最大并发</span>
          <input name="max_concurrency_visible" type="number" min="1" max="32" value="1">
        </label>

        <div class="hint">
          这是「自有兼容上游」的导入入口：填你自己的接口地址与凭据。
          如果你要登录腾讯 WorkBuddy、华为 CodeArts、阿里 Qoder 等渠道，
          请回控制台的「渠道接入」页点对应渠道，那走的是厂商自己的登录流程。
        </div>
      </div>

      <p class="err" id="import-error" role="alert"></p>
      <p class="ok" id="import-ok"></p>

      <div class="actions">
        <button class="btn primary" type="submit" id="import-submit">保存账号</button>
        <button class="btn" type="button" id="import-close">关闭窗口</button>
      </div>
    </div>
  </form>
</div>

<script type="module" src="/assets/connect.mjs?v=1.4.0"></script>
<!-- 表单逻辑走同源静态模块；页面 CSP 采用 script-src 'self'。 -->

</body>
</html>
