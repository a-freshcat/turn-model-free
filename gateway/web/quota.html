<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>配额看板 · 账号池与用量调度</title>
  <link rel="stylesheet" href="/assets/vendor/turn-model-free/dist/demo.css">
  <link rel="stylesheet" href="/assets/app.css?v=1.2.13">
  <link rel="stylesheet" href="/assets/quota.css?v=20261105-ui8">
</head>
<body>
  <main class="quota-shell ofm_root">
    <header class="ofm_hero ofm_glass">
      <div class="ofm_pagehead">
        <div class="ofm_pagetitle">
          <h1>配额看板 · 独立号池调度</h1>
          <p class="ofm_pagesub">按账号分类展示平台类型、并发容量、实时调度开关与三个独立配额池当前用量。</p>
        </div>
        <div class="quota-actions">
          <a class="ofm_btn" id="quota-back" href="/">返回渠道</a>
          <button class="ofm_btn" id="quota-theme" type="button">切换主题</button>
          <button class="ofm_btn primary" id="quota-refresh" type="button">刷新配额</button>
        </div>
      </div>
      <div class="quota-toolbar">
        <div class="ofm_seg" role="group" aria-label="分组筛选" id="quota-group-tabs">
          <button type="button" data-group="all" aria-pressed="true">全部账号池</button>
          <button type="button" data-group="antigravity" aria-pressed="false">Gemini / Antigravity 自用池</button>
          <button type="button" data-group="external" aria-pressed="false">其他独立渠道池</button>
        </div>
        <label for="quota-account">账号筛选
          <select id="quota-account">
            <option value="">全部账号</option>
          </select>
        </label>
        <div class="quota-summary-pills" id="quota-summary"></div>
        <span id="quota-updated" class="ofm_note">正在读取…</span>
      </div>
      <p class="ofm_note">每个 Antigravity 账号固定包含三个独立配额池（Argon、Claude/GPT、其他 Gemini/内部型号）；池内数值不一致时按最低剩余折算当前已使用比例，不跨池累加或平均。</p>
    </header>
    <p id="quota-error" class="ofm_balanceerror" role="alert"></p>
    <div id="quota-accounts"></div>
    <p id="quota-empty" class="ofm_note quota-empty-box" hidden>当前筛选下暂无账号。请返回渠道页添加或切换上方分组筛选。</p>
  </main>
  <div id="quota-auth" class="ofm_scrim" hidden>
    <form id="quota-auth-form" class="ofm_modal gateway-form" role="dialog" aria-labelledby="quota-auth-title">
      <div class="ofm_modalhead" id="quota-auth-title">连接本机号池</div>
      <label class="guard-row" for="quota-key">网关密钥<input id="quota-key" type="password" autocomplete="current-password" required></label>
      <p id="quota-auth-error" class="ofm_balanceerror" role="alert"></p>
      <div class="ofm_modalfoot"><button class="ofm_btn primary" type="submit">连接</button></div>
    </form>
  </div>
  <section id="protection-panel" class="protection-panel protection-floating" role="alert" aria-live="assertive" hidden></section>
  <script type="module" src="/assets/quota.mjs?v=20261106-ui11"></script>
  <script type="module" src="/assets/protection.mjs?v=1.2.13"></script>
</body>
</html>
